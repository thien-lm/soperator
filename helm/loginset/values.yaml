# Default values for loginset.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
nameOverride: ""
fullnameOverride: ""

# clusterName is used to derive the names of the backing resources that the
# soperator controller normally creates for a SlurmCluster of this name:
# the munge key Secret, the sshd host keys Secret, the sshd-root-public-keys
# ConfigMap, the security-limits ConfigMap and the sshd-configs ConfigMap.
# Each login set can override these references individually.
clusterName: "fpt-hpc"

# Whether the parent Slurm cluster has GPUs. Mirrors the SLURM_CLUSTER_WITH_GPU
# env var injected into the sshd container by the soperator controller.
clusterWithGPU: true

# Default container images used by the login sets.
# Each login set may override these per-container via its own `image` field.
images:
  sshd:
    repository: "registry.fke.fptcloud.com/xplat-fke/login_sshd"
    tag: "4.1.8-slurm25.11.3"
  munge:
    repository: "registry.fke.fptcloud.com/xplat-fke/munge"
    tag: "4.1.8-slurm25.11.3"
  sssd:
    repository: "registry.fke.fptcloud.com/xplat-fke/sssd"
    tag: "2.9.4-1-63"

# Login sets configuration.
# Each entry renders one StatefulSet, one sshd Service, one headless Service, and
# (when hpa.enabled is true) one HorizontalPodAutoscaler.
loginsets:
  - name: login-vin-ncai
    annotations: {}
    labels: {}
    size: 1

    resourceThresholds:
      enabled: true
      memory: 90
      cpu: 90
      cpuSampleSeconds: 0

    nodeSelector: {}
    affinity: {}
    tolerations: []
    priorityClassName: ""

    mungeKeySecretName: ""
    sshdKeysSecretName: ""
    sshRootPublicKeysConfigMapName: "fpt-hpc-ssh-root-keys-login-vin-ncai"
    sshRootPublicKeysExternal: false
    securityLimitsConfigMapName: ""
    sshdConfigMapName: ""

    sshd:
      image:
        repository: ""
        tag: ""
        pullPolicy: "IfNotPresent"
      appArmorProfile: "unconfined"
      readinessProbe:
        tcpSocket:
          port: 22
        timeoutSeconds: 1
        periodSeconds: 60
        successThreshold: 1
        failureThreshold: 3
      port: 22
      resources:
        cpu: "1000m"
        memory: "8Gi"
        ephemeralStorage: "30Gi"
        cpuLimit: "1000m"
      command: []
      args: []
      customEnv: []

    sshRootPublicKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP64B8oQ4Z051O9O6Y3+1tAIFiKjHe769WgkljUYn79L v.tuanhm15@vinsmartfuture.tech"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFhrbZQaF3HYsbsxsKatv/YulgeQdV4vNsLE4nTv8mrr thienlm4@fpt.com.vn"

    sshdServiceType: "ClusterIP"
    sshdServiceLoadBalancerIP: ""
    sshdServiceLoadBalancerSourceRanges: []
    sshdServiceNodePort: 30022
    sshdServiceAnnotations:
      loadbalancer.fptcloud.com/timeout-client-data: '500000000'
      loadbalancer.fptcloud.com/timeout-member-connect: '500000000'
      loadbalancer.fptcloud.com/timeout-member-data: '500000000'
      service.beta.kubernetes.io/fpt-load-balancer-internal: 'true'

    munge:
      image:
        repository: ""
        tag: ""
        pullPolicy: "IfNotPresent"
      appArmorProfile: "unconfined"
      command: []
      args: []
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - /usr/bin/munge -n > /dev/null && exit 0 || exit 1
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 3
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - test -S /run/munge/munge.socket.2
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 3
      resources:
        cpu: "500m"
        memory: "500Mi"
        ephemeralStorage: "5Gi"
        cpuLimit: ""

    sssd:
      enabled: false
      image:
        repository: ""
        tag: ""
        pullPolicy: "IfNotPresent"
      appArmorProfile: "unconfined"
      command: []
      args: []
      resources:
        cpu: "200m"
        memory: "500Mi"
        ephemeralStorage: "5Gi"
        cpuLimit: ""
    sssdDebugLevel: 0
    sssdConfSecretRefName: ""
    sssdLdapCAConfigMapRefName: ""

    customInitContainers: []
    volumes:
      jail:
        persistentVolumeClaim:
          claimName: jail-pvc
      jailSubMounts:
        - mountPath: /home/home-001
          name: home-001
          readOnly: false
          volumeSource:
            persistentVolumeClaim:
              claimName: home-001
        - mountPath: /mnt/data-001
          name: data-001
          readOnly: false
          volumeSource:
            persistentVolumeClaim:
              claimName: data-001
        - mountPath: /home/home-002
          name: home-002
          readOnly: false
          volumeSource:
            persistentVolumeClaim:
              claimName: home-002
        - mountPath: /mnt/data-002
          name: data-002
          readOnly: false
          volumeSource:
            persistentVolumeClaim:
              claimName: data-002
      customMounts: []

    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 80
      behavior: {}

