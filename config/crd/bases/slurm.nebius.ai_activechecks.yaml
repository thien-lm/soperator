---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: activechecks.slurm.nebius.ai
spec:
  group: slurm.nebius.ai
  names:
    kind: ActiveCheck
    listKind: ActiveCheckList
    plural: activechecks
    singular: activecheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Active check type
      jsonPath: .spec.checkType
      name: Type
      type: string
    - description: Whether to run this check after creation
      jsonPath: .spec.runAfterCreation
      name: Init
      type: boolean
    - description: Whether to suspend periodic runs of this check
      jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - description: Schedule
      jsonPath: .spec.schedule
      name: Schedule
      type: string
    - description: Status of the last K8s job
      jsonPath: .status.k8sJobsStatus.lastJobStatus
      name: K8s Status
      type: string
    - description: Status of the last Slurm job
      jsonPath: .status.slurmJobsStatus.lastRunStatus
      name: Slurm Status
      type: string
    - description: Submission time of the last Slurm job
      jsonPath: .status.slurmJobsStatus.lastRunSubmitTime
      name: Slurm Submit Time
      type: string
    - description: ID of the last Slurm job
      jsonPath: .status.slurmJobsStatus.lastRunId
      name: Slurm ID
      type: string
    - description: When the job was created
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ActiveCheck is the Schema for the activechecks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ActiveCheckSpec defines the desired state of ActiveCheck.
            properties:
              activeDeadlineSeconds:
                default: 1800
                description: ActiveDeadlineSeconds defines the CronJob timeout in
                  seconds
                format: int64
                type: integer
              affinity:
                $ref: '#/definitions/k8s.io~1api~1core~1v1~0Affinity'
                description: |-
                  Affinity defines the desired affinity for the K8s nodes to place Slurm workers on
                  NOTE: Affinity could not be set if NodeSelector is specified
              checkType:
                default: k8sJob
                description: CheckType defines the type of the check
                enum:
                - k8sJob
                - slurmJob
                type: string
              dependsOn:
                description: |-
                  DependsOn specifies dependency on another active checks that should be completed
                  before running this one.
                  Name of another checks in the same namespace.
                  Note: All checks that the current one depends on must have runAfterCreation: true;
                  otherwise, the dependency relationship won’t be respected.
                items:
                  type: string
                type: array
              failedJobsHistoryLimit:
                default: 16
                description: FailedJobsHistoryLimit defines the number of failed finished
                  jobs to retain
                format: int32
                type: integer
              failureReactions:
                description: FailureReactions defines reaction on specific check when
                  it fails
                properties:
                  addReservation:
                    description: AddReservation adds a slurm reservation with name
                      "<prefix>-<nodeName>"
                    properties:
                      prefix:
                        type: string
                    type: object
                  commentSlurmNode:
                    description: CommentSlurmNode enabling slurm node commenting
                    properties:
                      commentPrefix:
                        type: string
                    type: object
                  drainSlurmNode:
                    description: DrainSlurmNode enabling slurm node draining
                    properties:
                      drainReasonPrefix:
                        type: string
                    type: object
                  removeReservation:
                    description: RemoveReservation removs slurm reservation with name
                      "<prefix>-<nodeName>"
                    properties:
                      prefix:
                        type: string
                    type: object
                type: object
              hostUsers:
                description: |-
                  HostUsers controls whether the pod containers can share the host user namespace.
                  When omitted in the ActiveCheck, the operator/Helm chart will still configure
                  pod.spec.hostUsers, using either this value or an auto-detected default; the
                  runtime is not expected to perform defaulting in this setup.
                  Set to false only if the runtime supports user namespaces.
                type: boolean
              k8sJobSpec:
                description: K8sJobSpec defines options for k8s cronjob
                properties:
                  jobContainer:
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the containers
                        type: string
                      args:
                        items:
                          type: string
                        type: array
                      command:
                        items:
                          type: string
                        type: array
                      env:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0EnvVar'
                        type: array
                      image:
                        type: string
                      volumeMounts:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeMount'
                        type: array
                      volumes:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0Volume'
                        type: array
                      workingDir:
                        type: string
                    type: object
                  mungeContainer:
                    description: |-
                      MungeContainer defines the munge sidecar container for k8sJob checks that need Slurm authentication.
                      When specified, a munge init container will be added to the pod along with slurm config volumes.
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the containers
                        type: string
                      args:
                        items:
                          type: string
                        type: array
                      command:
                        items:
                          type: string
                        type: array
                      env:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0EnvVar'
                        type: array
                      image:
                        type: string
                      volumeMounts:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeMount'
                        type: array
                      volumes:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0Volume'
                        type: array
                      workingDir:
                        type: string
                    type: object
                  scriptRefName:
                    description: ScriptRefName name of configMap with custom script.
                      Data expected in the key script.sh inside ConfigMap.
                    type: string
                type: object
              name:
                description: Name defines the name of k8s cronJob
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector defines the desired selector for the K8s nodes to place Slurm workers on


                  NOTE: NodeSelector could not be set if Affinity is specified
                type: object
              podTemplateNameRef:
                description: PodTemplateNameRef points to a PodTemplate that contains
                  the pod configuration.
                type: string
              runAfterCreation:
                default: true
                description: RunAfterCreation specifies whether the job should run
                  immediately after the CronJob is created.
                type: boolean
              schedule:
                default: 0 0 1 1 *
                description: |-
                  Schedule defines the CronJob schedule.
                  By default, every year - at 00:00 on day-of-month 1 in January
                type: string
              slurmClusterRefName:
                description: SlurmClusterRefName defines the name of Slurm Cluster
                type: string
              slurmJobSpec:
                description: SlurmJobSpec defines options for k8s cronjob which creates
                  slurm job
                properties:
                  eachWorkerJobs:
                    default: false
                    description: Run sbatch script on each worker exactly once using
                      separate jobs
                    type: boolean
                  jobContainer:
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the containers
                        type: string
                      args:
                        items:
                          type: string
                        type: array
                      command:
                        items:
                          type: string
                        type: array
                      env:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0EnvVar'
                        type: array
                      image:
                        type: string
                      volumeMounts:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeMount'
                        type: array
                      volumes:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0Volume'
                        type: array
                      workingDir:
                        type: string
                    type: object
                  maxNumberOfJobs:
                    default: 0
                    description: |-
                      MaxNumberOfJobs defines the maximum number of simultaneously running jobs.
                      If it's less than number of workers random MaxNumberOfJobs workers will be chosen.
                      If MaxNumberOfJobs equals 0 there is no limitation.
                    format: int64
                    type: integer
                  mungeContainer:
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the containers
                        type: string
                      args:
                        items:
                          type: string
                        type: array
                      command:
                        items:
                          type: string
                        type: array
                      env:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0EnvVar'
                        type: array
                      image:
                        type: string
                      volumeMounts:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeMount'
                        type: array
                      volumes:
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0Volume'
                        type: array
                      workingDir:
                        type: string
                    type: object
                  sbatchScript:
                    description: Multiline sbatch script
                    type: string
                  sbatchScriptRefName:
                    description: SbatchScriptRefName name of configMap with sbatch
                      script. Data expected in the key sbatch.sh inside ConfigMap.
                    type: string
                type: object
              successReactions:
                description: SuccessReactions defines reaction on specific check when
                  it succeeds
                properties:
                  addReservation:
                    description: AddReservation adds a slurm reservation with name
                      "<prefix>-<nodeName>"
                    properties:
                      prefix:
                        type: string
                    type: object
                  commentSlurmNode:
                    description: CommentSlurmNode enabling slurm node commenting
                    properties:
                      commentPrefix:
                        type: string
                    type: object
                  drainSlurmNode:
                    description: DrainSlurmNode enabling slurm node draining
                    properties:
                      drainReasonPrefix:
                        type: string
                    type: object
                  removeReservation:
                    description: RemoveReservation removs slurm reservation with name
                      "<prefix>-<nodeName>"
                    properties:
                      prefix:
                        type: string
                    type: object
                type: object
              successfulJobsHistoryLimit:
                default: 3
                description: SuccessfulJobsHistoryLimit defines the number of successful
                  finished jobs to retain
                format: int32
                type: integer
              suspend:
                default: true
                description: Suspend indicates whether the action is suspended.
                type: boolean
              tolerations:
                description: Tolerations define the desired tolerations for the K8s
                  nodes to place Slurm workers on
                items:
                  $ref: '#/definitions/k8s.io~1api~1core~1v1~0Toleration'
                type: array
            required:
            - name
            - slurmClusterRefName
            type: object
          status:
            description: ActiveCheckStatus defines the observed state of ActiveCheck.
            properties:
              conditions:
                description: 'Known .status.conditions.type are: "Available", "Progressing",
                  and "Degraded"'
                items:
                  description: Condition defines status condition of the resource
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    lastUpdateTime:
                      description: |-
                        LastUpdateTime is the last time of given type update.
                        This value is used for status TTL update and removal
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Type of condition in CamelCase or in name.namespace.resource.victoriametrics.com/CamelCase.
                      maxLength: 316
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              k8sJobsStatus:
                description: ActiveCheckK8sJobsStatus defines the observed state of
                  ActiveCheck k8s jobs.
                properties:
                  lastJobName:
                    type: string
                  lastJobScheduleTime:
                    format: date-time
                    type: string
                  lastJobStatus:
                    description: ActiveCheckK8sJobStatus defines status for ActiveCheck
                      k8s job.
                    type: string
                  lastJobSuccessfulTime:
                    format: date-time
                    type: string
                  lastTransitionTime:
                    format: date-time
                    type: string
                required:
                - lastJobName
                - lastJobStatus
                type: object
              observedGeneration:
                description: ObservedGeneration defines current generation picked
                  by operator for the reconcile
                format: int64
                type: integer
              reason:
                description: Reason defines human readable error reason
                type: string
              slurmJobsStatus:
                description: ActiveCheckSlurmJobsStatus defines the observed state
                  of ActiveCheck slurm jobs.
                properties:
                  lastRunCancelledJobs:
                    items:
                      type: string
                    type: array
                  lastRunErrorJobsAndReasons:
                    items:
                      properties:
                        jobID:
                          type: string
                        reason:
                          type: string
                      required:
                      - jobID
                      - reason
                      type: object
                    type: array
                  lastRunFailJobsAndReasons:
                    items:
                      properties:
                        jobID:
                          type: string
                        reason:
                          type: string
                      required:
                      - jobID
                      - reason
                      type: object
                    type: array
                  lastRunId:
                    type: string
                  lastRunName:
                    type: string
                  lastRunStatus:
                    description: ActiveCheckSlurmRunStatus defines status for ActiveCheck
                      slurm job.
                    type: string
                  lastRunSubmitTime:
                    format: date-time
                    type: string
                  lastTransitionTime:
                    format: date-time
                    type: string
                type: object
              updateStatus:
                description: UpdateStatus defines a status for update rollout
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
