---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: nodesets.slurm.nebius.ai
spec:
  group: slurm.nebius.ai
  names:
    kind: NodeSet
    listKind: NodeSetList
    plural: nodesets
    singular: nodeset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The phase of NodeSet lifecycle.
      jsonPath: .status.phase
      name: Status
      type: string
    - description: The desired number of workers.
      jsonPath: .spec.replicas
      name: Desired
      type: integer
    - description: The current number of workers being ready for some time.
      jsonPath: .status.replicas
      name: Ready
      type: integer
    - description: Whether the NodeSet uses ephemeral nodes.
      jsonPath: .spec.ephemeralNodes
      name: Ephemeral
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeSet is the Schema for the nodesets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeSetSpec defines the desired state of NodeSet
            properties:
              affinity:
                $ref: '#/definitions/k8s.io~1api~1core~1v1~0Affinity'
                description: |-
                  Affinity defines the desired affinity for the K8s nodes to place Slurm workers on
                  NOTE: Affinity could not be set if NodeSelector is specified
              configMapRefSshd:
                description: |-
                  ConfigMapRefSSHD defines the config name of Slurm SSHD.
                  Specifying a custom name allows providing custom config for the Slurm SSHD.


                  If omitted, the default name and values of config will be used.
                type: string
              configMapRefSupervisord:
                description: |-
                  ConfigMapRefSupervisord defines the config name of Supervisord for the slurmd container.
                  Specifying a custom name allows providing custom config for the Supervisord.


                  If omitted, the default name and values of config will be used.
                type: string
              customInitContainers:
                description: CustomInitContainers represent additional init containers
                  which will be added to worker pods.
                items:
                  $ref: '#/definitions/k8s.io~1api~1core~1v1~0Container'
                type: array
              enableHostUserNamespace:
                default: false
                description: |-
                  EnableHostUserNamespace controls if the pod containers can use the host user namespace.
                  Defaults to false.
                type: boolean
              ephemeralNodes:
                default: false
                description: |-
                  EphemeralNodes enables ephemeral node behavior for this NodeSet.
                  When true, nodes will use dynamic topology injection instead of legacy topology.conf.
                  Topology data is read from the topology-node-labels ConfigMap at runtime
                  and passed to slurmd via --conf "Topology=..." parameter.
                  This mode is designed for cloud/ephemeral worker nodes that may be dynamically
                  added or removed from the cluster.
                type: boolean
              ephemeralTopologyWaitTimeout:
                default: 180
                description: |-
                  EphemeralTopologyWaitTimeout specifies the maximum time (in seconds) to wait
                  for topology data to become available before starting slurmd.
                  Only used when EphemeralNodes is true.
                  Defaults to 180 seconds (3 minutes).
                format: int32
                minimum: 60
                type: integer
              gpu:
                description: GPU defines the settings related to GPU support for Slurm
                  workers.
                properties:
                  enabled:
                    default: false
                    description: Enabled indicates whether GPU support is enabled
                      for the Nodes of the NodeSet.
                    type: boolean
                  nvidia:
                    description: Nvidia contains settings specific to Nvidia GPUs.
                    properties:
                      gdrCopyEnabled:
                        default: false
                        description: GDRCopyEnabled determines whether GDRCopy should
                          be enabled for Nvidia GPUs.
                        type: boolean
                    type: object
                type: object
              initialNumberEphemeralNodes:
                default: 1
                description: |-
                  InitialNumberEphemeralNodes specifies the initial number of powered-up nodes
                  when the NodeSetPowerState is first created and EphemeralNodes is true.
                  Changing this value after the initial creation has no effect; use NodeSetPowerState
                  directly to scale active nodes up or down.
                  Defaults to 1.
                format: int32
                minimum: 0
                type: integer
              maxUnavailable:
                anyOf:
                - type: integer
                - type: string
                default: 20%
                description: |-
                  MaxUnavailable represents the maximum number of worker pods that can be unavailable during the update.
                  Value can be an absolute number (ex: 5) or a percentage of desired pods (ex: 10%).
                  Absolute number is calculated from percentage by rounding down.
                  Also, MaxUnavailable can just be allowed to work with [k8s.io/api/apps/v1.ParallelPodManagement].
                  Defaults to 20%.
                x-kubernetes-int-or-string: true
              munge:
                description: Munge defines the Slurm munge configuration.
                properties:
                  image:
                    description: Image defines the image used for the Slurm munge
                      container
                    properties:
                      pullPolicy:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0PullPolicy'
                        default: IfNotPresent
                        description: PullPolicy defines the image pull policy
                        enum:
                        - Always
                        - Never
                        - IfNotPresent
                      repository:
                        description: |-
                          Repository defines the full name (with repository) of container image.
                          Only the image name could be provided if needed.
                        type: string
                      tag:
                        description: Tag defines the image tag
                        type: string
                    required:
                    - repository
                    type: object
                  livenessProbe:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                    description: LivenessProbe defines the liveness probe for the
                      munge container.
                  readinessProbe:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                    description: ReadinessProbe defines the readiness probe for the
                      munge container.
                  resources:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0ResourceList'
                    description: Resources define the [corev1.ResourceList] for the
                      Slurm munge container.
                  security:
                    description: Security defines the security configuration for the
                      container
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the container
                        type: string
                      limitsConfig:
                        description: "SecurityLimitsConfig defines the multiline content
                          of \"limits.conf\".\nA line should have the following format:\n\t*
                          <soft|hard> <item> <value>\n\n\nExample:\n\t* soft nofile
                          1024"
                        type: string
                      procMount:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0ProcMountType'
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          This requires the ProcMountType feature flag to be enabled.
                          Note that this field cannot be set when spec.os.name is windows.
                        enum:
                        - Default
                        - Unmasked
                    type: object
                required:
                - image
                type: object
              nodeConfig:
                description: NodeConfig provides possibility to define extra values
                  set for Node in `slurm.conf`.
                properties:
                  dynamic:
                    default: ""
                    description: |-
                      Dynamic provides a possibility to define "Extra" field of the corresponding Slurm node.
                      It can use any environment variables that are available in the slurmd container when it starts.
                    type: string
                  features:
                    description: Features defines the list of Slurm Node "Features"
                      to filter nodes during job scheduling.
                    items:
                      type: string
                    type: array
                  gresConfig:
                    description: |-
                      GRESConfig provides a possibility to define node-scoped settings in gres.conf.
                      Multiple lines can be passed. Each line will be prefixed with NodeName=<node-names-from-the-nodeset>.
                    items:
                      type: string
                    type: array
                  static:
                    default: ""
                    description: |-
                      Static provides a possibility to define extra values per Node (e.g. CPU topology).
                      This line will be provided to the config as is.
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector defines the desired selector for the K8s nodes to place Slurm workers on


                  NOTE: NodeSelector could not be set if Affinity is specified
                type: object
              priorityClass:
                description: PriorityClass defines the priority class for the Slurm
                  worker pods
                type: string
              replicas:
                default: 1
                description: |-
                  Replicas specifies the number of worker nodes in the NodeSet.


                  Defaults to 1 if not specified.
                format: int32
                type: integer
              slurmd:
                description: Slurmd defines the Slurm worker daemon configuration.
                properties:
                  customEnv:
                    description: CustomEnv defines additional environment variables
                      that should be set in the container.
                    items:
                      $ref: '#/definitions/k8s.io~1api~1core~1v1~0EnvVar'
                    type: array
                  image:
                    description: Image defines the image used for the Slurm worker
                      container
                    properties:
                      pullPolicy:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0PullPolicy'
                        default: IfNotPresent
                        description: PullPolicy defines the image pull policy
                        enum:
                        - Always
                        - Never
                        - IfNotPresent
                      repository:
                        description: |-
                          Repository defines the full name (with repository) of container image.
                          Only the image name could be provided if needed.
                        type: string
                      tag:
                        description: Tag defines the image tag
                        type: string
                    required:
                    - repository
                    type: object
                  livenessProbe:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                    description: LivenessProbe defines the liveness probe for the
                      slurmd container.
                  port:
                    default: 6818
                    description: Port defines the port the container exposes
                    format: int32
                    type: integer
                  readinessProbe:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                    description: ReadinessProbe defines the readiness probe for the
                      slurmd container.
                  resources:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0ResourceList'
                    description: |-
                      Resources define the [corev1.ResourceList] for the `slurmd` container.
                      It includes both usual cpu, memory, etc., as well, as 3rd-party resource specifications.
                  security:
                    description: Security defines the security configuration for the
                      container
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the container
                        type: string
                      limitsConfig:
                        description: "SecurityLimitsConfig defines the multiline content
                          of \"limits.conf\".\nA line should have the following format:\n\t*
                          <soft|hard> <item> <value>\n\n\nExample:\n\t* soft nofile
                          1024"
                        type: string
                      procMount:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0ProcMountType'
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          This requires the ProcMountType feature flag to be enabled.
                          Note that this field cannot be set when spec.os.name is windows.
                        enum:
                        - Default
                        - Unmasked
                    type: object
                  volumes:
                    description: Volumes define the volume configurations for the
                      Slurm worker container
                    properties:
                      customVolumeMounts:
                        description: CustomVolumeMounts define the configuration of
                          volume mounts within the worker container
                        items:
                          description: NodeVolumeMount defines the configuration of
                            volume mount
                          properties:
                            mountPath:
                              description: MountPath defines the path where the sub-mount
                                is mounted
                              type: string
                            name:
                              description: Name defines the name of the sub-mount
                              type: string
                            readOnly:
                              description: ReadOnly defines whether the mounting point
                                should be read-only
                              type: boolean
                            subPath:
                              description: |-
                                SubPath defines a sub-path inside the referenced VolumeSource or VolumeClaimTemplateSpec instead of its root.
                                Corresponds to the [corev1.VolumeMount.SubPath] field.


                                See: https://kubernetes.io/docs/concepts/storage/volumes/#using-subpath
                              type: string
                            volumeClaimTemplateSpec:
                              $ref: '#/definitions/k8s.io~1api~1core~1v1~0PersistentVolumeClaimSpec'
                              description: VolumeClaimTemplateSpec defines the [corev1.PersistentVolumeClaim]
                                template specification
                            volumeSource:
                              $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeSource'
                              description: VolumeSource defines the volume source
                                for the sub-mount
                          required:
                          - mountPath
                          - name
                          type: object
                        type: array
                      jail:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeSource'
                        description: Jail represents the jail data volume configuration
                      jailSubMounts:
                        description: JailSubMounts define the configuration of volume
                          mounts within the jail volume
                        items:
                          description: NodeVolumeMount defines the configuration of
                            volume mount
                          properties:
                            mountPath:
                              description: MountPath defines the path where the sub-mount
                                is mounted
                              type: string
                            name:
                              description: Name defines the name of the sub-mount
                              type: string
                            readOnly:
                              description: ReadOnly defines whether the mounting point
                                should be read-only
                              type: boolean
                            subPath:
                              description: |-
                                SubPath defines a sub-path inside the referenced VolumeSource or VolumeClaimTemplateSpec instead of its root.
                                Corresponds to the [corev1.VolumeMount.SubPath] field.


                                See: https://kubernetes.io/docs/concepts/storage/volumes/#using-subpath
                              type: string
                            volumeClaimTemplateSpec:
                              $ref: '#/definitions/k8s.io~1api~1core~1v1~0PersistentVolumeClaimSpec'
                              description: VolumeClaimTemplateSpec defines the [corev1.PersistentVolumeClaim]
                                template specification
                            volumeSource:
                              $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeSource'
                              description: VolumeSource defines the volume source
                                for the sub-mount
                          required:
                          - mountPath
                          - name
                          type: object
                        type: array
                      persistentVolumeClaimRetentionPolicy:
                        default:
                          whenDeleted: Delete
                          whenScaled: Delete
                        description: |-
                          PersistentVolumeClaimRetentionPolicy controls PVC retention for all
                          volumeClaimTemplateSpec volumes in this NodeSet.
                          This applies to all PVC templates in the StatefulSet, not per mount.
                          If omitted, both whenDeleted and whenScaled default to Delete.
                        properties:
                          whenDeleted:
                            default: Delete
                            description: WhenDeleted controls what happens with PVC
                              templates when the NodeSet is deleted.
                            enum:
                            - Retain
                            - Delete
                            type: string
                          whenScaled:
                            default: Delete
                            description: WhenScaled controls what happens with PVC
                              templates when the NodeSet is scaled down.
                            enum:
                            - Retain
                            - Delete
                            type: string
                        type: object
                      sharedMemorySize:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 64Gi
                        description: SharedMemorySize defines the size of the shared
                          memory (/dev/shm)
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      spool:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0VolumeSource'
                        description: Spool represents the spool data volume configuration
                    required:
                    - jail
                    - spool
                    type: object
                required:
                - image
                - resources
                - volumes
                type: object
              sssd:
                description: SSSD defines the SSSD sidecar configuration.
                properties:
                  image:
                    description: Image defines the image used for the SSSD container
                    properties:
                      pullPolicy:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0PullPolicy'
                        default: IfNotPresent
                        description: PullPolicy defines the image pull policy
                        enum:
                        - Always
                        - Never
                        - IfNotPresent
                      repository:
                        description: |-
                          Repository defines the full name (with repository) of container image.
                          Only the image name could be provided if needed.
                        type: string
                      tag:
                        description: Tag defines the image tag
                        type: string
                    required:
                    - repository
                    type: object
                  livenessProbe:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                    description: LivenessProbe defines the liveness probe for the
                      SSSD container.
                  readinessProbe:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                    description: ReadinessProbe defines the readiness probe for the
                      SSSD container.
                  resources:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0ResourceList'
                    description: Resources define the [corev1.ResourceList] for the
                      SSSD container.
                  security:
                    description: Security defines the security configuration for the
                      container
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the container
                        type: string
                      limitsConfig:
                        description: "SecurityLimitsConfig defines the multiline content
                          of \"limits.conf\".\nA line should have the following format:\n\t*
                          <soft|hard> <item> <value>\n\n\nExample:\n\t* soft nofile
                          1024"
                        type: string
                      procMount:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0ProcMountType'
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          This requires the ProcMountType feature flag to be enabled.
                          Note that this field cannot be set when spec.os.name is windows.
                        enum:
                        - Default
                        - Unmasked
                    type: object
                required:
                - image
                type: object
              sssdConfSecretRefName:
                description: SSSDConfSecretRefName is the name of the Secret containing
                  sssd.conf for worker and sssd sidecar containers.
                type: string
              sssdDebugLevel:
                default: 0
                description: |-
                  SSSDDebugLevel defines the SSSD debug verbosity level.
                  Lower values are suitable for production, higher values are intended for troubleshooting.
                format: int32
                minimum: 0
                type: integer
              sssdLdapCAConfigMapRefName:
                description: SSSDLdapCAConfigMapRefName is the name of the ConfigMap
                  containing LDAP CA certificates for the sssd sidecar.
                type: string
              tolerations:
                description: Tolerations define the desired tolerations for the K8s
                  nodes to place Slurm workers on
                items:
                  $ref: '#/definitions/k8s.io~1api~1core~1v1~0Toleration'
                type: array
              workerAnnotations:
                additionalProperties:
                  type: string
                description: WorkerAnnotations represent K8S annotations that should
                  be added to the worker pods.
                type: object
            required:
            - munge
            - slurmd
            type: object
          status:
            description: NodeSetStatus defines the observed state of SlurmCluster
            properties:
              conditions:
                description: |-
                  Conditions represent the observations of a NodeSet's current state.
                  Known types are: ConditionNodeSetConfigUpdated, ConditionNodeSetConfigDynamicUpdated, ConditionNodeSetStatefulSetUpdated, ConditionNodeSetPodsReady, and ConditionNodeSetStatefulSetTerminated.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              labelSelector:
                description: LabelSelector is label selectors for query over pods
                  that should match the replica count used by HPA.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed for this StatefulSet. It corresponds to the
                  StatefulSet's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
              phase:
                default: Pending
                description: |-
                  Phase indicates the current phase of the NodeSet lifecycle.
                  Known values are: PhaseNodeSetPending, PhaseNodeSetConfiguring, PhaseNodeSetProvisioning, PhaseNodeSetReady, PhaseNodeSetDegraded, and PhaseNodeSetTerminating.
                type: string
              replicas:
                description: Replicas is the number of Pods created by the StatefulSet
                  controller and being in `Ready` state for some time.
                format: int32
                type: integer
            required:
            - replicas
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.labelSelector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
