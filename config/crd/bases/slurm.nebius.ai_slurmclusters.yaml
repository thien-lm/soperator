---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: slurmclusters.slurm.nebius.ai
spec:
  group: slurm.nebius.ai
  names:
    kind: SlurmCluster
    listKind: SlurmClusterList
    plural: slurmclusters
    singular: slurmcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The phase of Slurm cluster creation.
      jsonPath: .status.phase
      name: Status
      type: string
    - description: Whether controllers are ready
      jsonPath: .status.conditions[?(@.type=="ControllersAvailable")].status
      name: Controllers
      type: string
    - description: The number of ready login pods
      jsonPath: .status.readyLogin
      name: Login
      type: integer
    - description: Whether SConfigController is ready
      jsonPath: .status.conditions[?(@.type=="SConfigControllerAvailable")].status
      name: SConfigCtrl
      type: string
    - description: Whether accounting is ready
      jsonPath: .status.conditions[?(@.type=="AccountingAvailable")].status
      name: Accounting
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: SlurmCluster is the Schema for the slurmclusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SlurmClusterSpec defines the desired state of SlurmCluster
            properties:
              cgroupVersion:
                default: v2
                description: CgroupVersion defines the version of the cgroup used
                  by Slurm workers.
                enum:
                - v1
                - v2
                type: string
              crVersion:
                description: CRVersion defines the version of the Operator the Custom
                  Resource belongs to
                type: string
              customCgroupConfig:
                description: |-
                  CustomCgroupConfig represents the raw cgroup configuration from cgroup.conf.
                  All options are provided as a raw string.
                  Soperator does not guarantee the validity of the raw configuration.
                  Raw config is appended to the generated cgroup.conf content.
                type: string
              customSlurmConfig:
                description: |-
                  CustomSlurmConfig represents the raw Slurm configuration from slurm.conf.
                  All options are provided as a raw string.
                  Soperator does not guarantee the validity of the raw configuration.
                  Raw config is merged with existing SlurmConfig values.
                type: string
              healthCheckConfig:
                description: HealthCheckConfig defines Slurm health check configuration.
                properties:
                  healthCheckInterval:
                    description: HealthCheckInterval defines interval for health check
                      run in seconds.
                    format: int32
                    type: integer
                  healthCheckNodeState:
                    description: HealthCheckNodeState identifies what node states
                      should execute the HealthCheckProgram.
                    items:
                      properties:
                        state:
                          description: State identifies node state on which HealthCheckProgram
                            should be executed.
                          enum:
                          - ALLOC
                          - ANY
                          - CYCLE
                          - IDLE
                          - NONDRAINED_IDLE
                          - MIXED
                          type: string
                      required:
                      - state
                      type: object
                    minItems: 1
                    type: array
                  healthCheckProgram:
                    description: HealthCheckProgram defines program for health check
                      run.
                    type: string
                required:
                - healthCheckInterval
                - healthCheckNodeState
                - healthCheckProgram
                type: object
              k8sNodeFilters:
                description: K8sNodeFilters define the k8s node filters used in Slurm
                  node specifications
                items:
                  description: K8sNodeFilter defines the k8s node filter used in Slurm
                    node specifications
                  properties:
                    affinity:
                      $ref: '#/definitions/k8s.io~1api~1core~1v1~0Affinity'
                      description: |-
                        Affinity defines the desired affinity for the node
                        NOTE: Affinity could not be set if NodeSelector is specified
                    name:
                      description: Name defines the name of the filter
                      minLength: 1
                      type: string
                    nodeSelector:
                      additionalProperties:
                        type: string
                      description: |-
                        NodeSelector defines the desired selector for the node


                        NOTE: NodeSelector could not be set if Affinity is specified
                      type: object
                    tolerations:
                      description: Tolerations define the desired tolerations for
                        the node
                      items:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0Toleration'
                      type: array
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              maintenance:
                default: none
                description: |-
                  Maintenance defines the maintenance window for the cluster.
                  It can have the following values:
                  - none: No maintenance is performed. The cluster operates normally.
                  - downscale: Scales down all components to 0.
                  - downscaleAndDeletePopulateJail: Scales down all components to 0 and deletes the kubernetes Kind Jobs populateJail.
                  - downscaleAndOverwritePopulateJail: Scales down all components to 0 and overwrite populateJail (same as overwrite=true).
                  - skipPopulateJail: Skips the execution of the populateJail job during maintenance.
                enum:
                - none
                - downscale
                - downscaleAndDeletePopulateJail
                - downscaleAndOverwritePopulateJail
                - skipPopulateJail
                type: string
              mpiConfig:
                default:
                  pmixEnv: OMPI_MCA_btl_tcp_if_include=eth0
                description: MPIConfig represents the PMIx configuration in mpi.conf.
                  Not all options are supported.
                properties:
                  pmixEnv:
                    default: OMPI_MCA_btl_tcp_if_include=eth0
                    description: |-
                      Semicolon separated list of environment variables to be set in job environments to be used by PMIx.
                      Defaults to "OMPI_MCA_btl_tcp_if_include=eth0" to avoid "lo" and "docker" interfaces to be selected by OpenMPI.
                    type: string
                type: object
              partitionConfiguration:
                description: |-
                  PartitionConfiguration define partition configuration of slurm worker nodes
                  https://slurm.schedmd.com/slurm.conf.html#SECTION_PARTITION-CONFIGURATION
                properties:
                  configType:
                    default: default
                    description: |-
                      ConfigType defines what behaviour should be used for partition generation.


                      PartitionConfigTypeDefault - generates 3 standard partitions:
                       - `main` - Default partition for regular jobs (PriorityTier=10)
                       - `hidden` - Hidden partition for administrative tasks (Hidden=YES)


                      PartitionConfigTypeCustom - uses raw partition configuration strings from RawConfig.


                      PartitionConfigTypeStructured - enables NodeSet references and structured partition definitions.
                    enum:
                    - default
                    - custom
                    - structured
                    type: string
                  partitions:
                    description: |-
                      Partitions define partition configuration as a list of structured Partition[s].
                      It is used when ConfigType == PartitionConfigTypeStructured.
                    items:
                      description: Partition defines a structured configuration of
                        Partition configuration.
                      properties:
                        config:
                          description: |-
                            Config allows to provide additional configuration for a Partition regarding https://slurm.schedmd.com/slurm.conf.html#SECTION_PARTITION-CONFIGURATION.


                            Example:
                             Default=NO MaxTime=8:00:00 AllowGroups=ml-team State=UP
                          type: string
                        isAll:
                          default: false
                          description: IsAll allows to define a Partition including
                            all nodes in the cluster.
                          type: boolean
                        name:
                          description: Name defines a name of the Partition.
                          minLength: 1
                          type: string
                        nodeSetRefs:
                          description: |-
                            NodeSetRefs allows to define a Partition including specific NodeSet[s].
                            Each value must be unique and correspond to one of the NodeSet.Metadata.Name.
                          items:
                            type: string
                          type: array
                      required:
                      - name
                      type: object
                    type: array
                  rawConfig:
                    description: |-
                      RawConfig defines partition configuration as list of string started with PartitionName.
                      It is used when ConfigType == PartitionConfigTypeCustom.


                      Example for custom ConfigType:
                       - PartitionName=low_priority  Nodes=worker-[0-15]  Default=YES MaxTime=INFINITE State=UP PriorityTier=1
                       - PartitionName=high_priority Nodes=worker-[10-20] Default=NO  MaxTime=INFINITE State=UP PriorityTier=2
                    items:
                      type: string
                    type: array
                type: object
                x-kubernetes-validations:
                - message: Structured partition configuration requires at least one
                    partition
                  rule: self.configType != 'structured' || size(self.partitions) >
                    0
              plugStackConfig:
                default:
                  ncclDebug:
                    enabled: false
                    logLevel: INFO
                    outputDirectory: /opt/soperator-outputs/nccl_logs
                    outputToFile: true
                    outputToStdOut: false
                    required: false
                  pyxis:
                    importerPath: /opt/slurm_scripts/pyxis_caching_importer.sh
                    required: true
                description: PlugStackConfig represents the Plugin stack configurations
                  in `plugstack.conf`.
                properties:
                  customPlugins:
                    default: []
                    description: PluginConfigCustom represents a configuration of
                      custom SPANK plugins.
                    items:
                      description: PluginConfigCustom represents a custom SPANK plugin
                        configuration.
                      properties:
                        arguments:
                          additionalProperties:
                            type: string
                          default: {}
                          description: Arguments define a map of key-value arguments
                            provided to the plugin.
                          type: object
                        path:
                          description: |-
                            Path defines an absolute path to the plugin's shared library file.
                            It could be just a filename of the library if it's located inside `/usr/lib/<ARCH>-linux-gnu/slurm/`.
                          type: string
                        required:
                          default: false
                          description: |-
                            Required defines if the plugin is 'required' for SLURM.
                            Otherwise, 'optional'.
                          type: boolean
                      required:
                      - path
                      type: object
                    type: array
                  ncclDebug:
                    default:
                      enabled: false
                      logLevel: INFO
                      outputDirectory: /opt/soperator-outputs/nccl_logs
                      outputToFile: true
                      outputToStdOut: false
                      required: false
                    description: NcclDebug represents the 'NCCL Debug' SPANK plugin
                      configuration.
                    properties:
                      enabled:
                        default: false
                        description: Enabled defines whether to enable the plugin.
                        type: boolean
                      logLevel:
                        default: INFO
                        description: LogLevel defines NCCL's log level to be forced.
                        enum:
                        - VERSION
                        - WARN
                        - INFO
                        - TRACE
                        type: string
                      outputDirectory:
                        default: /opt/soperator-outputs/nccl_logs
                        description: |-
                          OutputDirectory defines a directory path where OutputToFile has to be created.


                          The path could be both absolute or relative (to where `srun` or `sbatch` are being called from).
                          The trailing slash is possible.


                          If the path does not exist, it will be created by the plugin.
                        type: string
                      outputToFile:
                        default: true
                        description: |-
                          OutputToFile defines whether to additionally redirect `NCCL_DEBUG` outputs to the output file.
                          Output filename will have the following format:
                           <WORKER_NAME>.<JOB_ID>.<STEP_ID>.out
                        type: boolean
                      outputToStdOut:
                        default: false
                        description: |-
                          OutputToStdOut defines whether to additionally redirect `NCCL_DEBUG` outputs to the standard output stream.
                          This will make `NCCL_DEBUG` logs being present in job output.
                        type: boolean
                      required:
                        default: false
                        description: |-
                          Required defines if NCCL Debug is 'required' for SLURM.
                          Otherwise, 'optional'.
                        type: boolean
                    type: object
                  pyxis:
                    default:
                      importerPath: /opt/slurm_scripts/pyxis_caching_importer.sh
                      required: true
                    description: Pyxis represents the 'Pyxis' SPANK plugin configuration.
                    properties:
                      containerImageSave:
                        description: |-
                          ContainerImageSave represents an absolute path to the file or directory where SquashFS files will be stored.
                          If the specified file or directory already exists, it will be reused.
                          If the path does not exist, it will be created.


                          A directory path must end with '/' (e.g., /path/to/directory/ vs. /path/to/file).
                          If the image name contains '/', a nested directory will be created under the specified path (if it is a directory).
                          If the option argument is empty (""), SquashFS files will not be stored.
                        type: string
                      importerPath:
                        default: /opt/slurm_scripts/pyxis_caching_importer.sh
                        description: |-
                          Path to the executable for pyxis importer extension.
                          File should be available to execute for every user in Slurm.
                          More docs: https://github.com/NVIDIA/pyxis/tree/v0.23.0/importers.
                        type: string
                      required:
                        default: true
                        description: |-
                          Required defines if Pyxis is 'required' for SLURM.
                          Otherwise, 'optional'.
                        type: boolean
                    type: object
                type: object
              populateJail:
                description: PopulateJail defines the k8s Job that performs initial
                  jail file system population
                properties:
                  appArmorProfile:
                    default: unconfined
                    description: AppArmorProfile defines the AppArmor profile for
                      the Slurm node
                    type: string
                  hostUsers:
                    description: HostUsers controls if the pod containers can use
                      the host user namespace
                    type: boolean
                  image:
                    description: Image defines the populate jail container image
                    type: string
                  imagePullPolicy:
                    $ref: '#/definitions/k8s.io~1api~1core~1v1~0PullPolicy'
                    default: IfNotPresent
                    description: ImagePullPolicy defines the image pull policy
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                  jailSnapshotVolume:
                    description: |-
                      JailSnapshotVolume represents configuration of the volume containing the initial content of the jail root
                      directory. If not set, the default content is used (the Image already includes this default content)
                    properties:
                      volumeClaimTemplateSpec:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0PersistentVolumeClaimSpec'
                        description: VolumeClaimTemplateSpec defines the [corev1.PersistentVolumeClaim]
                          template specification
                      volumeSourceName:
                        description: |-
                          VolumeSourceName defines the name of the volume source.
                          Must correspond to the name of one of [VolumeSource]
                        type: string
                    type: object
                  k8sNodeFilterName:
                    description: |-
                      K8sNodeFilterName defines the Kubernetes node filter name associated with the Slurm node.
                      Must correspond to the name of one of [K8sNodeFilter]
                    type: string
                  overwrite:
                    default: false
                    description: Overwrite defines whether to overwrite content on
                      the jail volume if it's already populated.
                    type: boolean
                  priorityClass:
                    description: PriorityClass for PopulateJail job
                    type: string
                required:
                - image
                - k8sNodeFilterName
                type: object
              sConfigController:
                description: SConfigController defines the desired state of controller
                  that watches after configs
                properties:
                  container:
                    description: NodeContainer defines the configuration for one of
                      node containers
                    properties:
                      appArmorProfile:
                        default: unconfined
                        description: AppArmorProfile defines the AppArmor profile
                          for the Slurm containers
                        type: string
                      args:
                        description: |-
                          Args defines the arguments to the entrypoint (command).
                          The container image's CMD is used if this is not provided.
                        items:
                          type: string
                        type: array
                      command:
                        description: |-
                          Command defines the entrypoint array for the container. Not executed within a shell.
                          The container image's ENTRYPOINT is used if this is not provided.
                        items:
                          type: string
                        type: array
                      customEnv:
                        description: CustomEnv defines additional environment variables
                          that should be set in the container.
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0EnvVar'
                        type: array
                      image:
                        description: Image defines the container image
                        type: string
                      imagePullPolicy:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0PullPolicy'
                        default: IfNotPresent
                        description: ImagePullPolicy defines the image pull policy
                        enum:
                        - Always
                        - Never
                        - IfNotPresent
                      livenessProbe:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                        description: LivenessProbe defines the liveness probe for
                          the container.
                      port:
                        description: Port defines the port the container exposes
                        format: int32
                        type: integer
                      procMount:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0ProcMountType'
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          This requires the ProcMountType feature flag to be enabled.
                          Note that this field cannot be set when spec.os.name is windows.
                        enum:
                        - Default
                        - Unmasked
                      readinessProbe:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0Probe'
                        description: ReadinessProbe defines the readiness probe for
                          the container.
                      resources:
                        $ref: '#/definitions/k8s.io~1api~1core~1v1~0ResourceList'
                        description: Resources defines the [corev1.ResourceRequirements]
                          for the container
                      securityLimitsConfig:
                        description: |-
                          SecurityLimitsConfig represents multiline limits.conf
                          format of a string should be: '* <soft|hard> <item> <value>'
                          example: '* soft nofile 1024'
                        type: string
                    required:
                    - image
                    type: object
                  hostUsers:
                    description: HostUsers controls if the pod containers can use
                      the host user namespace
                    type: boolean
                  node:
                    description: SlurmNode represents the common configuration for
                      a Slurm node.
                    properties:
                      customInitContainers:
                        description: CustomInitContainers represent additional init
                          containers that should be added to created Pods
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0Container'
                        type: array
                      hostUsers:
                        description: HostUsers controls if the pod containers can
                          use the host user namespace
                        type: boolean
                      k8sNodeFilterName:
                        description: |-
                          K8sNodeFilterName defines the Kubernetes node filter name associated with the Slurm node.
                          Must correspond to the name of one of [K8sNodeFilter]
                        type: string
                      priorityClass:
                        description: PriorityClass for Slurm node pods
                        type: string
                      size:
                        description: Size defines the number of node instances
                        format: int32
                        type: integer
                    required:
                    - k8sNodeFilterName
                    type: object
                  reconfigurePollInterval:
                    default: 20s
                    description: |-
                      ReconfigurePollInterval defines the interval for polling node restart status during reconfiguration.
                      Defaults to 20s
                    type: string
                  reconfigureWaitTimeout:
                    default: 5m
                    description: |-
                      ReconfigureWaitTimeout defines the maximum time to wait for all nodes to restart during reconfiguration.
                      Must be greater than ReconfigurePollInterval. Defaults to 1m
                    type: string
                  runAsGid:
                    description: |-
                      RunAsGid defines GID to run SConfigController process
                      This will be manifested as GID of files maintained by SConfigController
                      Defaults to whatever is set in sconfigcontroller image
                    format: int64
                    type: integer
                  runAsUid:
                    description: |-
                      RunAsUid defines UID to run SConfigController process
                      This will be manifested as UID of files maintained by SConfigController
                      Defaults to whatever is set in sconfigcontroller image
                    format: int64
                    type: integer
                  serviceAccountName:
                    description: |-
                      ServiceAccountName is the name of the ServiceAccount to use for sconfigcontroller pods.
                      This field is required and must reference an existing ServiceAccount.
                    minLength: 1
                    type: string
                required:
                - serviceAccountName
                type: object
                x-kubernetes-validations:
                - message: ReconfigureWaitTimeout must be greater than ReconfigurePollInterval
                  rule: '!has(self.reconfigureWaitTimeout) || !has(self.reconfigurePollInterval)
                    || duration(self.reconfigureWaitTimeout) > duration(self.reconfigurePollInterval)'
              secrets:
                description: Secrets define the [corev1.Secret] references needed
                  for Slurm cluster operation
                properties:
                  sshdKeysName:
                    description: SshdKeysName defines name of the [corev1.Secret]
                      with ssh keys for SSHD server
                    type: string
                type: object
              slurmConfig:
                default:
                  completeWait: 5
                  defCpuPerGPU: 4
                  defMemPerNode: 0
                  epilog: ""
                  maxJobCount: 20000
                  messageTimeout: 60
                  minJobAge: 28800
                  prolog: ""
                description: SlurmConfig represents the Slurm configuration in slurm.conf.
                  Not all options are supported.
                properties:
                  completeWait:
                    default: 5
                    description: The time to wait, in seconds, when any job is in
                      the COMPLETING state before any additional jobs are scheduled.
                    format: int32
                    type: integer
                  defCpuPerGPU:
                    default: 4
                    description: Default count of CPUs allocated per allocated GPU
                    format: int32
                    type: integer
                  defMemPerNode:
                    default: 0
                    description: Default real memory size available per allocated
                      node in mebibytes.
                    format: int32
                    type: integer
                  epilog:
                    default: ""
                    description: Defines specific file to run the epilog when job
                      ends. Default value is no epilog
                    type: string
                  maxJobCount:
                    default: 20000
                    description: Keep N last jobs in controller memory
                    format: int32
                    type: integer
                  messageTimeout:
                    default: 60
                    description: |-
                      MessageTimeout specifies the permitted time for a round-trip communication to complete in seconds.
                      See https://slurm.schedmd.com/slurm.conf.html#OPT_MessageTimeout.
                    format: int32
                    type: integer
                  minJobAge:
                    default: 28800
                    description: Don't remove jobs from controller memory after some
                      time
                    format: int32
                    type: integer
                  prolog:
                    default: ""
                    description: Defines specific file to run the prolog when job
                      starts. Default value is no prolog
                    type: string
                  suspendTime:
                    default: 1000000000
                    description: |-
                      SuspendTime is the idle time in seconds after which ephemeral (CLOUD) nodes become eligible
                      for automatic power down. The default is a large finite value so Slurm power-save remains
                      enabled; with INFINITE/-1 and no partition-level finite SuspendTime, Slurm disables
                      power-save and scontrol power down cannot trigger SuspendProgram.
                    format: int32
                    type: integer
                  taskPluginParam:
                    default: ""
                    description: Additional parameters for the task plugin
                    type: string
                  topologyParam:
                    default: SwitchAsNodeRank
                    description: TopologyParam is list of comma-separated options
                      identifying network topology options.
                    type: string
                  topologyPlugin:
                    default: topology/tree
                    description: TopologyPlugin identifies the plugin to determine
                      network topology for optimizations.
                    type: string
                type: object
              slurmNodes:
                description: SlurmNodes define the desired state of Slurm nodes
                properties:
                  accounting:
                    description: |-
                      Accounting represents the Slurm accounting node and database configuration


                      TODO: Making accounting optional requires SlurmNode.K8sNodeFilterName to be optional.
                    properties:
                      customInitContainers:
                        description: CustomInitContainers represent additional init
                          containers that should be added to created Pods
                        items:
                          $ref: '#/definitions/k8s.io~1api~1core~1v1~0Container'
                        type: array
                      enabled:
                        default: false
                        description: Enabled defines whether the SlurmDBD is enabled
                        type: boolean
                      externalDB:
                        description: ExternalDB represents the external database configuration
                          of connection string
                        properties:
                          enabled:
                            default: false
                            description: Enabled defines whether the external database
                              is enabled
                            type: boolean
                          host:
                            description: Host for connection string to the SlurmDBD
                              database
                            type: string
                          passwordSecretKeyRef:
                            description: |-
                              PasswordSecretKeyRef defines the reference to the secret with the password key for the external database.
                              Either this or tls.clientCertSecretName must be provided as client credentials.
                            properties:
                              key:
                                description: Key defines the key of password in the
                                  secret (do not put here the password, just name
                                  of the key in the secret)
                                type: string
                              name:
                                description: Name defines the name of the secret
                                type: string
                            type: object
                          port:
                            default: 3306
                            description: Port for connection string to the SlurmDBD
                              database
                            format: int32
                            type: integer
                          storageParameters:
                            additionalProperties:
                              type: string
                            description: |-
                              StorageParameters defines the list of additional parameters to set in slurmdbd.conf's StorageParameters.
                              Some values here may be overridden by TLS configuration
                            type: object
                          tls:
                            description: TLS provides the configuration required to
                              establish TLS connection with the external MariaDB.
                            properties:
                              clientCertSecretRef:
                                description: |-
                                  ClientCertSecretName defines the reference to a Kubernetes TLS Secret (with tls.crt and tls.key files).
                                  Either this or passwordSecretKeyRef must be provided as client credentials.
                                  If set, it overrides SSL_CERT and SSL_KEY values in storageParameters
                                type: string
                              serverCASecretRef:
                                description: |-
                                  ServerCASecretRef defines the reference to a Secret containing the MariaDB server CA certificates.
                                  The secret should contain a 'ca.crt' key.
                                  If set, it overrides SSL_CA value in storageParameters
                                type: string
                            type: object
                          user:
                            description: Key defines the key of username and password
                              in the secret
                            type: string
                        type: object
                      hostUsers:
                        description: HostUsers controls if the pod containers can
                          use the host user namespace
                        type: boolean
                      k8sNodeFilterName:
                        description: |-
                          K8sNodeFilterName defines the Kubernetes node filter name associated with the Slurm node.
                          Must correspond to the name of one of [K8sNodeFilter]
                        type: string
                      mariadbOperator:
                        description: MariaDbOpeator represents the MariaDB CRD configuration
                        properties:
                          appArmorProfile:
                            default: unconfined
                            description: AppArmorProfile defines the AppArmor profile
                              for the Slurm containers
                            type: string
                          args:
                            description: |-
                              Args defines the arguments to the entrypoint (command).
                              The container image's CMD is used if this is not provided.
